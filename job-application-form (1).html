<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Apply online for open developer and design roles. Fill in your details, skills, shift preference and cover letter.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Job Application Form | Apply for a Role</title>
<style>
  :root {
    --bg: #eef2f1;
    --paper: #ffffff;
    --ink: #1c2b2a;
    --muted: #5d6f6d;
    --line: #c5d1cf;
    --accent: #0f6b66;
    --accent-dark: #0a4f4b;
    --req: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 6px solid var(--accent);
    padding: 32px 36px 36px;
  }
  h1 { margin: 0 0 4px; font-size: 1.9rem; }
  .intro { margin: 0 0 24px; color: var(--muted); }
  fieldset { border: 1px solid var(--line); margin: 0 0 22px; padding: 14px 18px 18px; }
  legend { font-weight: bold; padding: 0 8px; }
  .field { margin-bottom: 16px; display: flex; flex-direction: column; }
  .field:last-child { margin-bottom: 0; }
  label, .group-label { font-weight: bold; margin-bottom: 6px; font-size: .95rem; }
  .req { color: var(--req); }
  input[type=text], input[type=email], input[type=tel], input[type=date],
  input[type=url], select, textarea {
    font: inherit;
    padding: 9px 10px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    width: 100%;
  }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 3px solid #7fc6c0;
    border-color: var(--accent);
  }
  input:disabled {
    background: #e6ebea;
    color: var(--muted);
    cursor: not-allowed;
  }
  .options { display: flex; flex-wrap: wrap; gap: 8px 22px; }
  .options label { font-weight: normal; margin: 0; display: flex; align-items: center; gap: 6px; }
  textarea { resize: vertical; min-height: 130px; }
  .hint { font-size: .85rem; color: var(--muted); margin-top: 4px; }
  button {
    font: inherit;
    font-weight: bold;
    background: var(--accent);
    color: #fff;
    border: 0;
    padding: 12px 28px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
</style>
</head>
<body>
<main>
  <h1>Job Application Form</h1>
  <p class="intro">Fields marked with <span class="req">*</span> are required.</p>

  <form action="#" method="post">

    <fieldset>
      <legend>Personal details</legend>

      <div class="field">
        <label for="fullname">Full name <span class="req">*</span></label>
        <input type="text" id="fullname" name="fullname" placeholder="e.g. Asha Verma" required>
      </div>

      <div class="field">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="field">
        <label for="phone">Phone <span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
      </div>

      <div class="field">
        <label for="dob">Date of birth <span class="req">*</span></label>
        <input type="date" id="dob" name="dob" required>
      </div>

      <div class="field">
        <label for="applicant-id">Application ID</label>
        <input type="text" id="applicant-id" name="applicant_id" value="Assigned after submission" disabled>
        <span class="hint">This field is disabled and cannot be edited.</span>
      </div>
    </fieldset>

    <fieldset>
      <legend>Job details</legend>

      <div class="field">
        <label for="role">Job role <span class="req">*</span></label>
        <select id="role" name="role" required>
          <option value="">Select a role</option>
          <option value="frontend">Frontend Developer</option>
          <option value="backend">Backend Developer</option>
          <option value="fullstack">Full Stack Developer</option>
          <option value="designer">UI/UX Designer</option>
          <option value="tester">QA Engineer</option>
        </select>
      </div>

      <div class="field" role="radiogroup" aria-labelledby="shift-label">
        <span class="group-label" id="shift-label">Preferred shift <span class="req">*</span></span>
        <div class="options">
          <label><input type="radio" name="shift" value="morning" required> Morning</label>
          <label><input type="radio" name="shift" value="afternoon"> Afternoon</label>
          <label><input type="radio" name="shift" value="night"> Night</label>
        </div>
      </div>

      <div class="field">
        <span class="group-label" id="skills-label">Skills</span>
        <div class="options" role="group" aria-labelledby="skills-label">
          <label><input type="checkbox" name="skills" value="html"> HTML</label>
          <label><input type="checkbox" name="skills" value="css"> CSS</label>
          <label><input type="checkbox" name="skills" value="javascript"> JavaScript</label>
          <label><input type="checkbox" name="skills" value="react"> React</label>
          <label><input type="checkbox" name="skills" value="python"> Python</label>
        </div>
      </div>

      <div class="field">
        <label for="portfolio">Portfolio URL</label>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://yourportfolio.com">
      </div>
    </fieldset>

    <fieldset>
      <legend>Cover letter</legend>
      <div class="field">
        <label for="cover">Tell us why you are a good fit <span class="req">*</span></label>
        <textarea id="cover" name="cover_letter" placeholder="Write your cover letter here..." required></textarea>
      </div>
    </fieldset>

    <button type="submit">Submit application</button>
  </form>
</main>
</body>
</html>
